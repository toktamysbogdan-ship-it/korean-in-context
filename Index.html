  --tw-shadow-colored: 0 1px 2px 0 var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-xl{
  --tw-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 20px 25px -5px var(--tw-shadow-color), 0 8px 10px -6px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.outline-none{
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#FFF9F0;
  --card:#ffffff;
  --soft:#FFF0D6;
  --soft2:#EAF6FF;
  --soft3:#F1EBFF;
  --ink:#1A1626;
  --secondary:#4A445F;
  --muted:#7A6F8A;
  --faint:#8A86B0;
  --line:#F1DFC8;
  --track:#F1DFC8;
  --btn2:#2D2440;
  --btn2-text:#FFFFFF;
  --option:#FFFFFF;
  --correct-bg:#D8F5E3;
  --correct-text:#146632;
  --wrong-bg:#FFE0D6;
  --wrong-text:#9B2C2C;
  --korean:#1A1626;
  --peach:#FF9E7D;
  --mint:#7ED6A8;
  --lav:#B8A9FF;
  --sun:#FFD166;
  --sky:#7EC8FF;
  --saved:#1A8A4A;
  --select-bg:#FFFFFF
}

[data-theme="dark"]{
  --bg:#14121F;
  --card:#221E38;
  --soft:#2E2950;
  --soft2:#2A3550;
  --soft3:#332E52;
  --ink:#FFFFFF;
  --secondary:#D8D5EE;
  --muted:#A9A5C9;
  --faint:#8A86B0;
  --line:#38315E;
  --track:#2E2950;
  --btn2:#2E2950;
  --btn2-text:#FFFFFF;
  --option:#2E2950;
  --correct-bg:#1E5C3A;
  --correct-text:#A8F0C8;
  --wrong-bg:#5C1E2E;
  --wrong-text:#FFB3C0;
  --korean:#FFE9A8;
  --saved:#7ED6A8;
  --select-bg:#2E2950
}

[data-theme="light"]{
  --bg:#FFF9F0;
  --card:#ffffff;
  --soft:#FFF0D6;
  --soft2:#EAF6FF;
  --soft3:#F1EBFF;
  --ink:#1A1626;
  --secondary:#4A445F;
  --muted:#7A6F8A;
  --faint:#8A86B0;
  --line:#F1DFC8;
  --track:#F1DFC8;
  --btn2:#2D2440;
  --btn2-text:#FFFFFF;
  --option:#FFFFFF;
  --correct-bg:#D8F5E3;
  --correct-text:#146632;
  --wrong-bg:#FFE0D6;
  --wrong-text:#9B2C2C;
  --korean:#1A1626;
  --saved:#1A8A4A;
  --select-bg:#FFFFFF
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Baloo 2",system-ui,sans-serif
}

.font-head{
  font-family:"Fredoka","Baloo 2",sans-serif
}

.font-ko{
  font-family:"Gowun Dodum","Noto Sans KR",sans-serif
}

@keyframes bounceSoft{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-9px) rotate(2deg)
  }
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(-3deg)
  }

  50%{
    transform:rotate(3deg)
  }
}

@keyframes pop{
  0%{
    transform:scale(.9);
    opacity:0
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-6px)
  }
}

.mascot{
  animation:bounceSoft 2.4s ease-in-out infinite;
  display:inline-block
}

.mascot-slow{
  animation:floaty 3s ease-in-out infinite;
  display:inline-block
}

.pop{
  animation:pop .35s ease both
}

button{
  font-family:inherit
}

select,input{
  font-family:inherit
}

select{
  color:var(--ink);
  background:var(--select-bg)
}

select option{
  color:var(--ink);
  background:var(--select-bg)
}

::-webkit-scrollbar{
  height:8px;
  width:8px
}

::-webkit-scrollbar-thumb{
  background:#8A86B0;
  border-radius:99px
}

@media (min-width: 640px){
  .sm\:bottom-4{
    bottom: 1rem;
  }

  .sm\:right-8{
    right: 2rem;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-10{
    padding: 2.5rem;
  }

  .sm\:p-4{
    padding: 1rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-\[110px\]{
    font-size: 110px;
  }

  .sm\:text-\[17px\]{
    font-size: 17px;
  }

  .sm\:text-\[22px\]{
    font-size: 22px;
  }

  .sm\:text-\[34px\]{
    font-size: 34px;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:block{
    display: block;
  }

  .lg\:hidden{
    display: none;
  }

  .lg\:grid-cols-\[300px_1fr\]{
    grid-template-columns: 300px 1fr;
  }
}

@media (min-width: 1280px){
  .xl\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

 Bett."),m("몸이 피곤하다","momi pigonhada","тело устало","body is tired","corps fatigué","Körper ist müde","공부하고 나니 몸이 피곤해요.","После учёбы тело устало.","After studying, my body is tired.","Après avoir étudié, mon corps est fatigué.","Nach dem Lernen ist mein Körper müde.")]},{id:"intermediate-4",level:2,num:4,title:l("Путешествия","Travel","Voyages","Reisen"),pattern:"N + 을/를 + Verb",theory:[l("Путешествие = цепочка действий: купить → забронировать → поехать.","A trip is a chain: buy → book → go.","Un voyage est une chaîne : acheter → réserver → partir.","Eine Reise ist eine Kette: kaufen → buchen → losfahren."),l("여행을 떠나다 = «отправиться в путешествие».","여행을 떠나다 = “go on a trip”.","여행을 떠나다 = « partir en voyage ».","여행을 떠나다 = „auf eine Reise gehen“."),l("사진을 찍다, 길을 묻다 — полезные глаголы туриста.","사진을 찍다, 길을 묻다 are useful tourist verbs.","사진을 찍다, 길을 묻다 sont des verbes utiles en voyage.","사진을 찍다, 길을 묻다 sind nützliche Touristenverben.")],story:{ko:"내일은 여행을 떠나요. 표를 사고 호텔을 예약했어요. 여행지에서 사진을 찍을 거예요. 길을 모르면 길을 물을 거예요.",t:l("Завтра отправляюсь в путешествие. Купил билет и забронировал отель. В поездке буду фотографировать. Если не буду знать дорогу, спрошу её.","Tomorrow I’m going on a trip. I bought a ticket and booked a hotel. On the trip I’ll take photos. If I don’t know the way, I’ll ask for directions.","Demain, je pars en voyage. J’ai acheté un billet et réservé un hôtel. En voyage, je prendrai des photos. Si je ne connais pas le chemin, je demanderai mon chemin.","Morgen gehe ich auf eine Reise. Ich habe ein Ticket gekauft und ein Hotel gebucht. Auf der Reise werde ich Fotos machen. Wenn ich den Weg nicht kenne, frage ich nach dem Weg.")},questions:[{q:l("Когда герой отправляется?","When is the hero leaving?","Quand le héros part-il ?","Wann fährt der Held los?"),opts:[l("Завтра","Tomorrow","Demain","Morgen"),l("Вчера","Yesterday","Hier","Gestern"),l("Через год","In a year","Dans un an","In einem Jahr")],ans:0},{q:l("Что герой забронировал?","What did the hero book?","Qu /가 + Adjective",theory:[l("Чувства: 기분이 좋다, 화가 나다.","Feelings: 기분이 좋다, 화가 나다.","Sentiments : 기분이 좋다, 화가 나다.","Gefühle: 기분이 좋다, 화가 나다."),l("이/가 показывает, что именно чувствует: 마음이 따뜻하다.","이/가 shows what feels: 마음이 따뜻하다.","이/가 montre ce qui ressent : 마음이 따뜻하다.","이/가 zeigt, was fühlt: 마음이 따뜻하다."),l("Наречия усиливают: 크게 웃다, 조용히 울다.","Adverbs intensify: 크게 웃다, 조용히 울다.","Les adverbes intensifient : 크게 웃다, 조용히 울다.","Adverbien verstärken: 크게 웃다, 조용히 울다.")],story:{ko:"오늘은 기분이 좋아요. 마음이 따뜻해요. 친구와 크게 웃었어요. 슬플 때는 조용히 울 때도 있어요. 그래도 화가 나지 않으려고 해요.",t:l("Сегодня хорошее настроение. На душе тепло. С другом громко смеялся. Когда грустно, иногда тихо плачу. Но стараюсь не злиться.","Today I’m in a good mood. My heart is warm. I laughed loudly with a friend. When sad, I sometimes cry quietly. But I try not to get angry.","Aujourd’hui, je suis de bonne humeur. Mon cœur est chaleureux. J’ai ri fort avec un ami. Quand je suis triste, je pleure parfois doucement. Mais j’essaie de ne pas me fâcher.","Heute bin ich gut gelaunt. Mein Herz ist warm. Ich habe mit einem Freund laut gelacht. Wenn ich traurig bin, weine ich manchmal leise. Aber ich versuche, nicht wütend zu werden.")},questions:[{q:l("Какое настроение у героя?","What is the hero’s mood?","Quelle est l’humeur du héros ?","Wie ist die Stimmung des Helden?"),opts:[l("Хорошее","Good","Bonne","Gut"),l("Плохое","Bad","Mauvaise","Schlecht"),l("Скучное","Boring","Ennuyeuse","Langweilig")],ans:0},{q:l("С кем герой громко смеялся?","Who did the hero laugh loudly with?","Avec qui le héros a-t-il ri fort ?","Mit wem hat der Held laut gelacht?"),opts:[l("С другом","With a friend","Avec un ami","Mit einem Freund"),l("С учителем","With a teacher","Avec un professeur","Mit einem Lehrer"),l("Один","Alone","Seul","Allein")],ans:0},{q:l("Чего герой старается не делать?","What does the hero try not to do?","Qu’essaie de ne pas faire le héros ?","Was versucht der Held nicht zu tun?"),opts:[l("Не злиться","Not get angry","Ne pas se fâcher","Nicht w ух чистый, поэтому настроение хорошее. Защищаем море и не бросаем мусор.","We protect the environment. In the park we planted a tree. The air is fresh, so I feel good. We protect the sea and don’t throw away trash.","Nous protégeons l’environnement. Dans le parc, nous avons planté un arbre. L’air est frais, donc je me sens bien. Nous protégeons la mer et ne jetons pas de déchets.","Wir schützen die Umwelt. Im Park haben wir einen Baum gepflanzt. Die Luft ist frisch, also fühle ich mich gut. Wir schützen das Meer und werfen keinen Müll weg.")},questions:[{q:l("Где посадили дерево?","Where was the tree planted?","Où a-t-on planté l’arbre ?","Wo wurde der Baum gepflanzt?"),opts:[l("В парке","In the park","Dans le parc","Im Park"),l("В школе","At school","À l’école","In der Schule"),l("Дома","At home","À la maison","Zu Hause")],ans:0},{q:l("Какой воздух?","What is the air like?","Comment est l’air ?","Wie ist die Luft?"),opts:[l("Чистый","Fresh","Frais","Frisch"),l("Грязный","Dirty","Sale","Schmutzig"),l("Жаркий","Hot","Chaud","Heiß")],ans:0},{q:l("Что мы не делаем с мусором?","What don’t we do with trash?","Que ne faisons-nous pas avec les déchets ?","Was machen wir nicht mit Müll?"),opts:[l("Не бросаем его","Don’t throw it away","Ne le jetons pas","Werfen ihn nicht weg"),l("Не собираем","Don’t collect it","Ne le ramassons pas","Sammeln ihn nicht ein"),l("Не видим","Don’t see it","Ne le voyons pas","Sehen ihn nicht")],ans:0}],collos:[m("환경을 보호하다","hwangyeongeul bohohada","защищать окружающую среду","to protect the environment","protéger l’environnement","die Umwelt schützen","환경을 보호하는 일은 중요해요.","Защищать окружающую среду важно.","Protecting the environment is important.","Protéger l’environnement est important.","Die Umwelt zu schützen ist wichtig."),m("나무를 심다","namureul simda","сажать дерево","to plant a tree","planter un arbre","einen Baum pflanzen","봄에 나무를 심어요.","Весной сажаю дерево.","In spring I plant a tree.","Au printemps, je plante un arbre.","Im Frühling pflan
